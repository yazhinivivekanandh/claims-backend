# Generated connector document for Yoxa API Configuration.
openapi: 3.1.0
info:
  title: Process State Machine Router
  version: 0.1.0
servers:
  - url: https://claims-backend-26qu.onrender.com
paths:
  /api/patients/{patient_id}/state/advance:
    post:
      operationId: advancePatientState
      summary: "Advance the patient's workflow state"
      description: "Advances the patient's workflow state. The server computes the next state automatically from the patient's current state. The event field is optional and ignored; do not guess or choose an event name. Calling this twice is safe and idempotent. Returns the current_state and next_state values, which should be echoed in downstream context."
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
          description: Patient identifier, e.g. PAT-10482.
      requestBody:
        required: false
        content:
          application/json:
            schema:
                    type: object
                    properties:
                      event:
                        type: string
                      metadata:
                        type: ["object", "null"]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient_id:
                    type: string
                  transition_id:
                    type: ["string", "null"]
                  event:
                    type: string
                  current_state:
                    type: string
                  next_state:
                    type: ["string", "null"]
                  blocking:
                    type: boolean
                  blocking_reasons:
                    type: array
                    items:
                      type: string
                  note:
                    type: string
                required: [patient_id, event, current_state, blocking, blocking_reasons]
