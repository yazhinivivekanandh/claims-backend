            application/json:
              schema:
                type: object
                properties:
                  patient_id:
                    type: string
                  transition_id:
                    type: string
                  event:
                    type: string
                  current_state:
                    type: string
                  next_state:
                    type: string
                  blocking:
                    type: boolean
                  blocking_reasons:
                    type: array
